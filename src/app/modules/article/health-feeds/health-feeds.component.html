
<div class="p-3">
    <div class="text-center fw-7 mb-2" style="font-size: 22px;">Explore Articles by Category</div>
    <div class="text-center text-secondary fs-5 mb-2">Follow health topics you are interested in the same would appear below</div>
    <div class="py-3 mb-2 ft-top">
        <div *ngIf="tabList.length > 0">
            <!-- <div class="tab-name" routerLink="health-topics"><i class="fa-solid fa-plus me-2"></i> Follow Categories</div> -->
            <!-- <ng-container *ngFor="let tab of tabList">
                <div class="tab-name" [ngClass]="tab._id == currentTab._id? 'tab-active': ''" (click)="changeTab(tab)">
                    {{tab.CategoryName}}
                </div>
            </ng-container> -->
            <app-tab-lists [tabList]="tabList" [currentTab]="currentTab" (changeCategoryType)="changeTab($event)"></app-tab-lists>
        </div>
    </div>

    <div *ngIf="displayList.length > 0" class="cts-grid mb-3">
        <ng-container *ngFor="let cts of displayList">
            <div class="border rounded bx-shdw hvr bg-white" (click)="viewArtical(cts.Permalink)">
                <div class="position-relative">
                    <div class="tag" [style.background-color]="currentTab.ColorCode">{{currentTab.CategoryName}}</div>
                    <!-- <div class="tag" [style.backgroundColor]="getRandomColor()">{{currentTab.CategoryName}}</div> -->
                    <div class="mb-3">
                        <img [src]="cts.Content.Thumbnail" class="rounded-top" width="100%" alt="...">
                    </div>
                    <div class="mh-1 px-3">
                        <div class="fs-6 fw-6 line-clamp-2 mb-3">{{cts.Content.Title}}</div>
                        <div class="fs-3 text-secondary mb-3 line-clamp-2">{{cts.Content.ShortDescription}}</div>
                    </div>
                    <div class="d-flex justify-content-between mb-3 px-3">
                        <div>
                            <span class="text-secondary pe-3">{{cts.UpdatedDate | date : "MMM yy"}}</span>
                        </div>
                        <div class="text-secondary">                        
                            <span class="pe-3">
                                <span *ngIf="!cts.IsLiked"><i class="fa-regular fa-heart pe-1"></i></span>
                                <span *ngIf="cts.IsLiked"><i class="fa-solid fa-heart text-danger pe-1"></i></span>
                                {{cts.LikeCount}}
                            </span>
                            <span class="pe-3"><i class="fa-regular fa-eye pe-1"></i> {{cts.Viewcount}}</span>
                            <span class="">
                                <span *ngIf="!cts.IsBookmarked"><i class="fa-regular fa-bookmark pe-1"></i></span>
                                <span *ngIf="cts.IsBookmarked"><i class="fa-solid fa-bookmark text-success pe-1"></i></span>
                            </span>
                        </div>
                    </div>
                    <!-- <div class="fs-3">
                                <span class="px-1">
                                <span *ngIf="!cts.IsLiked" (click)="likeArticle(cts)" class="hvr"><i class="fa-regular fa-heart fs-7"></i></span>

                    </div> -->
                </div>                
            </div>
        </ng-container>
    </div>
