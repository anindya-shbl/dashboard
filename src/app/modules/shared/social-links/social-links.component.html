
<div class="social-link">
    <div class="d-flex align-items-center p-2">
        <i class="fa-solid fa-clipboard pe-3"></i>
        <a class="hvr" [ngClass]="isCopied? 'text-success': ''" (click)="copyText()">Copy Link</a>
    </div>
    <div class="d-flex align-items-center p-2">
        <i class="fa-brands fa-facebook pe-3"></i>
        <a href="https://www.facebook.com/share.php?u={{url}}" target="_blank">Facebook</a>
    </div>
    <div class="d-flex align-items-center p-2">
        <i class="fa-brands fa-square-whatsapp pe-3"></i>
        <a href="whatsapp://send?text={{url}}" target="_blank">Whatsapp</a>
    </div>
    <div class="d-flex align-items-center p-2">
        <i class="fa-brands fa-square-x-twitter pe-3"></i>
        <a href="https://twitter.com/intent/tweet?text={{url}}" target="_blank">Twitter</a>
    </div>
    <div class="d-flex align-items-center p-2">
        <i class="fa-solid fa-envelope pe-3"></i>
        <a href="mailto:?body={{url}}" title="Share by Email">Email Link</a>
    </div>

</div>
