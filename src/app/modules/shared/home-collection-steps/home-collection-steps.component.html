<div *ngIf="stepsData.length > 0" class="mb-4">
    <div class="fs-20 fw-7 mb-2">How Our Home Collection Work</div>
    <div class="ppckg">
        <owl-carousel-o [options]="customOptions">
            <ng-container *ngFor="let item of stepsData">
                <ng-template carouselSlide [id]="item.step">
                    <div class="p-2">
                        <div class="position-relative">
                            <div class="position-absolute top-0 start-0 ps-2 pt-2 z-2">
                                <span class="bg-primary text-white fs-3 fw-5"
                                    style="border-radius: 4px; padding: 4px 8px;">
                                    STEP: {{item.step}}
                                </span>
                            </div>
                            <div class="img-box mb-3">
                                <img [src]="item.imgUrl" class="rounded" alt="">
                            </div>
                        </div>
                        <div class="fs-5 fw-5 mb-2">{{item.title}}</div>
                        <div class="text-secondary">{{item.description}}</div>
                    </div>
                </ng-template>
            </ng-container>
        </owl-carousel-o>
    </div>
</div>
