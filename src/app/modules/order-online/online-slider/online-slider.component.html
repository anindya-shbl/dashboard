<ng-container *ngIf="popularCategory.length > 0">
    <owl-carousel-o [options]="customOptions">
        <ng-container *ngFor="let item of popularCategory">
            <ng-template carouselSlide [id]="item.id">
                <div class="p-2 hvr" (click)="viewCategory(item.actionUrl)">
                    <div class="border rounded-4 bg-white text-center p-3 bx-shdw box-animation">
                        <div class="item-box ">
                            <img [src]="item.imageUrl" alt="">
                        </div>
                        <div class="fw-5 mt-3 mb-2 text-truncate">{{item.title}}</div>
                    </div>
                </div>
            </ng-template>
        </ng-container>
    </owl-carousel-o>
</ng-container>
