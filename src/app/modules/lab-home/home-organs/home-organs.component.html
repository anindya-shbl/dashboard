<div *ngIf="OrganList.length > 0" class="p-3">
    <div class="d-flex justify-content-between mb-3">
        <span class="fs-20 fw-6">Test By Organs</span>
        <span class="text-primary hvr" (click)="viewByOrgan(OrganList[0].OrganName)">View all</span>
    </div>
    <owl-carousel-o [options]="customOptions">
        <ng-container *ngFor="let item of OrganList">
            <ng-template carouselSlide [id]="item.id">
                <!-- <div class="" (click)="viewCategory(item.actionUrl)"> -->
                    <div class="p-2">
                        <div class="rounded item-shadow hvr p-3 org-grad mx-230" (click)="viewByOrgan(item.OrganName)">
                            <div class="orng-img mb-3">
                                <img [src]="item.AppOrganImage" alt="">
                            </div>
                            <div class="fs-6 fw-5 text-center text-truncate mb-2">{{item.OrganName}}</div>
                        </div>
                        <div></div>
                    </div>
                <!-- </div> -->
            </ng-template>
        </ng-container>
    </owl-carousel-o>
</div>
