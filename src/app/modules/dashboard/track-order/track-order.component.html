<div class="d-flex w-100">
    <ng-container *ngFor="let info of trackList; let i = index">
        <!-- <ng-container *ngIf="info.DisplaySequence > 1">
            <div class="linebar" [ngClass]="info.orderProcessStatus == 1 ? 'bg-success' : 'bg-lt' "></div>
        </ng-container> -->

        <div class="text-center">
            <div style="font-size: 32px;">
                <span *ngIf="info.orderProcessCancelStatus == 0">
                    <i class="fa-solid fa-circle-check" [ngClass]="info.orderProcessStatus == 1 ? 'text-success' : 'txt-off' "></i>
                </span>
                <span *ngIf="info.orderProcessCancelStatus != 0">
                    <i class="fa-solid fa-circle-xmark text-danger"></i>
                </span>
            </div>
            <div class="fw-7" style="min-width: 80px;">
                <ng-container *ngIf="info.orderProcessCancelStatus == 0">
                    <span [ngClass]="info.orderProcessStatus == 1 ? 'text-success' : 'txt-off' ">{{info.StatusType}}</span>
                </ng-container>
                <ng-container *ngIf="info.orderProcessCancelStatus != 0">
                    <span class="text-danger">{{info.StatusType}}</span>
                </ng-container>
            </div>
            <div class="mt-1" style="font-size: 13px; color: rgb(75, 75, 75);">{{info.UpdatedDate}}</div>
        </div>

        <ng-container *ngIf="i != (trackList.length -1)">
            <div class="linebar" [ngClass]="info.orderProcessStatus == 1 ? 'bg-success' : 'bg-lt' "></div>
        </ng-container>
        
    </ng-container>
</div>
