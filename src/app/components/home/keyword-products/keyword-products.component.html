
<div class="key-grd p-3">
    <ng-container *ngFor="let item of kwPrdct">
    <div class="key-cont">
        <!-- <div class="fw-semibold fs-5 pb-2"></div> -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fs-20 fw-7">{{item.Title}}</span>
            <span class="text-primary hvr" (click)="viewCtalog(item)">View All</span>
        </div>
        <div *ngIf="item.Products.length >0" class="jito-grad p-2 rounded">
            <app-med-scroller [searchList]="item.Products"></app-med-scroller>
        </div>        
    </div>
</ng-container>
</div>
