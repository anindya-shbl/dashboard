<!-- map-location-picker.component.html -->
<div *ngIf="isOpen" class="modal-overlay" (click)="closeDialog()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="modal-header">
      <button class="close-btn" (click)="closeDialog()">←</button>
      <h2>Select Delivery Location</h2>
    </div>

    <!-- Unified Search Box -->
    <div class="search-box">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          placeholder="Search for an address, area, or pincode"
          [(ngModel)]="searchInput"
          (input)="onSearchChange()"
          class="search-input"
        />
      </div>
      
      <!-- Predictions/Results List -->
      <div *ngIf="predictions.length > 0" class="predictions-list">
        <div
          *ngFor="let prediction of predictions"
          (click)="selectPrediction(prediction)"
          class="prediction-item"
          [class.error-item]="prediction.isError"
        >
          <span class="icon" [class.error-icon]="prediction.isError">
            {{ prediction.isError ? '⚠️' : '📍' }}
          </span>
          <div>
            <div class="main">{{ prediction.main_text }}</div>
            <div class="secondary">{{ prediction.secondary_text }}</div>
          </div>
        </div>
      </div>

      <!-- Searching Indicator -->
      <div *ngIf="isSearching" class="searching-indicator">
        <span class="spinner"></span> Searching...
      </div>
    </div>

    <!-- Map Info -->
    <div class="map-info">
      <p class="map-instruction">📍 Place the pin at the exact delivery location</p>
    </div>

    <!-- Map Container -->
    <div #mapContainer class="map-container"></div>

    <!-- Location Info -->
    <div *ngIf="selectedLocation" class="location-info">
      <div class="info-header">
        <span class="location-icon">📍</span>
        <div>
          <h3>{{ selectedLocation.name }}</h3>
          <p class="address">{{ selectedLocation.address }}</p>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="modal-footer">
      <button (click)="confirmLocation()" class="confirm-btn">
        Confirm & Proceed
      </button>
    </div>
  </div>
</div>
